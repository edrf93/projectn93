<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publisher Onboarding | Nuclion.io</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; }
        .grid-bg { background-image: radial-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px); background-size: 30px 30px; }
        .form-glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-style { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 16px; color: white; transition: all 0.3s; width: 100%; }
        .input-style:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.3); }
        .btn-gradient { background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); transition: transform 0.2s; }
        .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3); }
    </style>
</head>
<body class="grid-bg min-h-screen flex items-center justify-center p-6">
    <div class="max-w-2xl w-full">
        <div class="text-center mb-10">
            <a href="index.html" class="inline-flex items-center gap-3 mb-8"><img src="media/logo.png" class="h-10 w-10"><span class="font-bold text-3xl">Nuclion.io</span></a>
            <h1 class="text-4xl font-extrabold mb-4">Start Your <span class="text-blue-500">Revenue Journey</span></h1>
            <p class="text-slate-500">Apply as a publisher and access premium Web, App & CTV demand.</p>
        </div>

        <div class="form-glass p-8 md:p-12 rounded-[2rem] shadow-2xl">
            <form action="#" method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label class="block text-sm font-bold text-slate-400 mb-2">Company Name</label><input type="text" placeholder="Acme Media Group" class="input-style"></div>
                    <div><label class="block text-sm font-bold text-slate-400 mb-2">Website URL</label><input type="url" placeholder="https://www.yoursite.com" class="input-style"></div>
                </div>
                <div><label class="block text-sm font-bold text-slate-400 mb-2">Primary Monetization Channel</label>
                    <select class="input-style bg-slate-900">
                        <option>Web Content</option>
                        <option>Mobile Application</option>
                        <option>CTV / FAST Channel</option>
                        <option>Video Content Creator</option>
                    </select>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label class="block text-sm font-bold text-slate-400 mb-2">Contact Email</label><input type="email" placeholder="hello@yoursite.com" class="input-style"></div>
                    <div><label class="block text-sm font-bold text-slate-400 mb-2">Monthly Impressions</label><input type="text" placeholder="1M+ impressions" class="input-style"></div>
                </div>
                <button type="submit" class="btn-gradient w-full py-4 rounded-xl font-bold text-lg text-white mt-8">Submit Application</button>
            </form>
            <p class="text-center text-xs text-slate-600 mt-8 leading-relaxed">By submitting, you agree to our <a href="terms.html" class="underline">Terms</a> and <a href="policy.html" class="underline">Privacy Policy</a>.</p>
        </div>
        <div class="text-center mt-8 text-sm"><a href="index.html" class="text-slate-400 hover:text-white transition"><i class="fas fa-arrow-left mr-2"></i> Back to Homepage</a></div>
    </div>
</body>
</html>
